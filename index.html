<!doctype html>
<html lang="ja">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>セルフラブ・エール | 今日頑張ったあなたへ</title>
        <!-- 爆速で見た目を整えるためにTailwind CSS（CDN）を読み込み -->
        <script src="https://cdn.tailwindcss.com"></script>
    </head>
    <body class="bg-amber-50 min-h-screen flex items-center justify-center p-4">
        <main
            class="max-w-md w-full bg-white rounded-2xl shadow-xl p-8 text-center border border-amber-100"
        >
            <!-- タイトルエリア -->
            <div class="mb-6">
                <span class="text-4xl">🌸</span>
                <h1 class="text-2xl font-bold text-gray-800 mt-2">
                    セルフラブ・エール
                </h1>
                <p class="text-sm text-gray-500 mt-1">
                    世界で一番の味方は、いつだって自分。
                </p>
            </div>

            <!-- 名言表示エリア（最初は案内メッセージ） -->
            <div
                id="message-box"
                class="bg-amber-50/60 p-6 rounded-xl my-6 border border-amber-200/50"
            >
                <p class="text-gray-700 text-base leading-relaxed">
                    下のボタンを押して、今日すずさんに必要なメッセージを受け取りましょう。
                </p>
            </div>

            <!-- アクションボタン -->
            <button
                id="get-btn"
                class="w-full bg-rose-400 hover:bg-rose-500 text-white font-bold py-3.5 px-6 rounded-xl shadow-md transition duration-200 transform active:scale-95"
            >
                メッセージを受け取る
            </button>
        </main>
    </body>
</html>
